<!doctype html>
<!--
  matrix-3d: volumetric Matrix code rain for asciipaper.

  Move the cursor   the camera turns toward it (left looks left, up looks up).
  Click             the rain turns to flow toward where you clicked; click near
                    the centre and it streams straight at you. A pulse ripples
                    out from the click.
  Double-click      back to rain falling straight down.
  Scroll            rain speed.

  Plain WebGL2, no network. Also runs in a normal browser for previewing.
-->
<html>
<head>
<meta charset="utf-8">
<title>Matrix 3D</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; cursor: default; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";

// ---- Tunables -------------------------------------------------------------
const CFG = {
  streams: 1400,        // number of falling columns
  trail: 26,            // max glyphs per column
  spacing: 0.62,        // distance between glyphs in a column
  box: 64,              // side of the cube of rain around the camera
  glyphSize: 0.52,      // world size of one glyph
  speed: 9,             // base fall speed (world units / s)
  maxYaw: 1.05,         // radians the camera turns at the screen's left/right edge
  maxPitch: 0.7,        // radians at the top/bottom edge
  lookEase: 3.2,        // how quickly the camera follows the cursor
  turnEase: 1.6,        // how quickly the rain swings to a new direction
  fov: 72,              // degrees
  color: [0.22, 1.0, 0.35],   // trail colour
  head:  [0.80, 1.0, 0.85],   // leading glyph colour
};

const canvas = document.getElementById("c");
const gl = canvas.getContext("webgl2", { antialias: false, alpha: false, premultipliedAlpha: false });
if (!gl) {
  document.body.innerHTML = '<p style="color:#3f6;font:16px monospace;padding:2em">WebGL2 unavailable</p>';
  throw new Error("WebGL2 unavailable");
}

// ---- Glyph atlas: mirrored half-width katakana plus digits, like the film ----
const CHARS = [];
for (let c = 0xFF66; c <= 0xFF9D; c++) CHARS.push(String.fromCharCode(c));
"012345789Z:.=*+-<>¦|".split("").forEach(ch => CHARS.push(ch));
const ATLAS_N = 8, CELL = 96;               // 8x8 grid, 64 slots
const atlas = document.createElement("canvas");
atlas.width = atlas.height = ATLAS_N * CELL;
{
  const g = atlas.getContext("2d");
  g.fillStyle = "#000"; g.fillRect(0, 0, atlas.width, atlas.height);
  g.textAlign = "center"; g.textBaseline = "middle";
  g.font = `${CELL * 0.7}px "Noto Sans Mono CJK JP", "Noto Sans CJK JP", "MS Gothic", monospace`;
  for (let i = 0; i < ATLAS_N * ATLAS_N; i++) {
    const ch = CHARS[i % CHARS.length];
    const x = (i % ATLAS_N) * CELL + CELL / 2, y = Math.floor(i / ATLAS_N) * CELL + CELL / 2;
    g.save();
    g.translate(x, y);
    if (i < 56) g.scale(-1, 1);             // mirror the katakana
    g.shadowColor = "#fff"; g.shadowBlur = CELL * 0.12;
    g.fillStyle = "#fff";
    g.fillText(ch, 0, 0);
    g.shadowBlur = 0;
    g.fillText(ch, 0, 0);
    g.restore();
  }
}
const atlasTex = gl.createTexture();
gl.bindTexture(gl.TEXTURE_2D, atlasTex);
gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
gl.texImage2D(gl.TEXTURE_2D, 0, gl.R8, atlas.width, atlas.height, 0, gl.RED, gl.UNSIGNED_BYTE, (() => {
  // keep only the red channel: brightness mask
  const d = atlas.getContext("2d").getImageData(0, 0, atlas.width, atlas.height).data;
  const r = new Uint8Array(d.length / 4);
  for (let i = 0; i < r.length; i++) r[i] = d[i * 4];
  return r;
})());
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
gl.generateMipmap(gl.TEXTURE_2D);

// ---- Shaders ----------------------------------------------------------------
const VS = `#version 300 es
precision highp float;
precision highp int;
uniform sampler2D u_streams;   // per stream: xyz head position, w seed
uniform mat4 u_view, u_proj;
uniform vec3 u_dir;            // flow direction (unit)
uniform float u_time, u_spacing, u_size, u_radius;
uniform int u_trail;
uniform vec3 u_clickRay;       // direction of the last click from the camera
uniform float u_clickAge;
out vec2 v_uv;
out float v_bright;
out float v_head;
out float v_ring;

float hash(float n) { return fract(sin(n) * 43758.5453123); }

void main() {
  int stream = gl_InstanceID / u_trail;
  int idx = gl_InstanceID - stream * u_trail;
  vec4 s = texelFetch(u_streams, ivec2(stream % 1024, stream / 1024), 0);
  float seed = s.w;

  float len = floor(float(u_trail) * (0.35 + 0.65 * hash(seed * 7.13)));
  vec2 corner = vec2(gl_VertexID & 1, gl_VertexID >> 1);
  v_uv = corner;
  if (float(idx) >= len) { gl_Position = vec4(2.0, 2.0, 2.0, 1.0); v_bright = 0.0; return; }

  vec3 world = s.xyz - u_dir * float(idx) * u_spacing;
  vec4 eye = u_view * vec4(world, 1.0);
  float dist = length(eye.xyz);

  // Camera-facing quad.
  eye.xy += (corner - 0.5) * u_size;
  gl_Position = u_proj * eye;

  // Glyph: changes now and then, the head more often.
  float rate = idx == 0 ? 14.0 : 0.6 + 2.5 * hash(seed + float(idx) * 1.7);
  float g = floor(hash(seed * 3.1 + float(idx) * 11.3 + floor(u_time * rate + hash(seed + float(idx))) * 0.37) * 64.0);
  v_uv = (vec2(mod(g, 8.0), floor(g / 8.0)) + vec2(corner.x, 1.0 - corner.y)) / 8.0;

  float t = float(idx) / max(len, 1.0);
  float fade = pow(1.0 - t, 1.6);
  float fog = smoothstep(u_radius, u_radius * 0.35, dist) * smoothstep(0.6, 2.5, dist);
  v_bright = fade * fog;
  v_head = idx == 0 ? 1.0 : 0.0;

  // Ring expanding outward from the click ray.
  float ang = acos(clamp(dot(normalize(world), u_clickRay), -1.0, 1.0));
  float front = u_clickAge * 1.4;
  v_ring = exp(-pow((ang - front) * 9.0, 2.0)) * exp(-u_clickAge * 1.1);
}`;

const FS = `#version 300 es
precision mediump float;
uniform sampler2D u_atlas;
uniform vec3 u_color, u_headColor;
in vec2 v_uv;
in float v_bright;
in float v_head;
in float v_ring;
out vec4 o;
void main() {
  float m = texture(u_atlas, v_uv).r;
  vec3 c = mix(u_color, u_headColor, v_head);
  float b = v_bright * (1.0 + v_head * 1.3) + v_ring * v_bright * 3.0;
  o = vec4(c * m * b, 1.0);
}`;

function compile(type, src) {
  const sh = gl.createShader(type);
  gl.shaderSource(sh, src); gl.compileShader(sh);
  if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(sh));
  return sh;
}
const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, VS));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FS));
gl.linkProgram(prog);
if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
gl.useProgram(prog);
const U = {};
for (const n of ["u_streams", "u_view", "u_proj", "u_dir", "u_time", "u_spacing", "u_size", "u_radius",
                 "u_trail", "u_clickRay", "u_clickAge", "u_atlas", "u_color", "u_headColor"])
  U[n] = gl.getUniformLocation(prog, n);

gl.bindVertexArray(gl.createVertexArray());   // no attributes: everything comes from IDs

// ---- Streams: head positions live on the CPU, uploaded as a float texture ----
const S = CFG.streams, TEX_W = Math.min(S, 1024), TEX_H = Math.ceil(S / 1024);
const heads = new Float32Array(TEX_W * TEX_H * 4);
const speeds = new Float32Array(S);
const half = CFG.box / 2;
for (let i = 0; i < S; i++) {
  heads[i * 4 + 0] = (Math.random() - 0.5) * CFG.box;
  heads[i * 4 + 1] = (Math.random() - 0.5) * CFG.box;
  heads[i * 4 + 2] = (Math.random() - 0.5) * CFG.box;
  heads[i * 4 + 3] = Math.random() * 1000;
  speeds[i] = 0.45 + Math.random() * 0.9;
}
const streamTex = gl.createTexture();
gl.activeTexture(gl.TEXTURE1);
gl.bindTexture(gl.TEXTURE_2D, streamTex);
gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA32F, TEX_W, TEX_H, 0, gl.RGBA, gl.FLOAT, heads);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
gl.activeTexture(gl.TEXTURE0);
gl.bindTexture(gl.TEXTURE_2D, atlasTex);

gl.uniform1i(U.u_atlas, 0);
gl.uniform1i(U.u_streams, 1);
gl.uniform1i(U.u_trail, CFG.trail);
gl.uniform1f(U.u_spacing, CFG.spacing);
gl.uniform1f(U.u_size, CFG.glyphSize);
gl.uniform1f(U.u_radius, half * 0.95);
gl.uniform3fv(U.u_color, CFG.color);
gl.uniform3fv(U.u_headColor, CFG.head);

gl.disable(gl.DEPTH_TEST);
gl.enable(gl.BLEND);
gl.blendFunc(gl.ONE, gl.ONE);                 // additive: overlapping code glows

// ---- Small vector helpers ---------------------------------------------------
const norm = v => { const l = Math.hypot(v[0], v[1], v[2]) || 1; return [v[0] / l, v[1] / l, v[2] / l]; };
const add = (a, b, k = 1) => [a[0] + b[0] * k, a[1] + b[1] * k, a[2] + b[2] * k];
const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];

// ---- Camera and input ---------------------------------------------------------
let yaw = 0, pitch = 0, targetYaw = 0, targetPitch = 0;
let dir = [0, -1, 0], targetDir = [0, -1, 0];
let speedMul = 1;
let clickRay = [0, 0, -1], clickTime = -100;
let lastMove = 0;

function basis(y, p) {
  const fwd = [Math.sin(y) * Math.cos(p), Math.sin(p), -Math.cos(y) * Math.cos(p)];
  const right = norm(cross(fwd, [0, 1, 0]));
  const up = cross(right, fwd);
  return { fwd, right, up };
}

// Screen point (0..1) -> world ray through it, for the current camera.
function rayAt(x, y) {
  const { fwd, right, up } = basis(yaw, pitch);
  const t = Math.tan(CFG.fov * Math.PI / 360), a = canvas.width / canvas.height;
  const sx = (x * 2 - 1) * t * a, sy = (1 - y * 2) * t;
  return norm(add(add(fwd, right, sx), up, sy));
}

addEventListener("pointermove", e => {
  const x = e.clientX / innerWidth, y = e.clientY / innerHeight;
  const k = window.asciipaper?.options?.pointer ?? 1;
  targetYaw = (x - 0.5) * 2 * CFG.maxYaw * k;
  targetPitch = (0.5 - y) * 2 * CFG.maxPitch * k;
  lastMove = performance.now();
});

addEventListener("pointerdown", e => {
  if (e.button !== 0) return;
  const x = e.clientX / innerWidth, y = e.clientY / innerHeight;
  const { fwd, right, up } = basis(yaw, pitch);
  // Offset from the screen centre decides the direction on screen; the closer
  // to the centre, the more the rain comes straight at the viewer.
  const dx = (x - 0.5) * 2, dy = (0.5 - y) * 2;
  const r = Math.min(1, Math.hypot(dx, dy));
  let d = add(add([0, 0, 0], right, dx), up, dy);
  d = add(d, fwd, -2.2 * Math.pow(1 - r, 2));   // toward the camera near the centre
  targetDir = norm(d);
  clickRay = rayAt(x, y);
  clickTime = performance.now();
});

addEventListener("dblclick", () => { targetDir = [0, -1, 0]; });

addEventListener("wheel", e => {
  speedMul = Math.min(4, Math.max(0.15, speedMul * Math.exp(-e.deltaY * 0.0015)));
}, { passive: true });

addEventListener("contextmenu", e => e.preventDefault());

// ---- Frame loop ---------------------------------------------------------------
function resize() {
  const dpr = window.devicePixelRatio || 1;
  canvas.width = Math.round(innerWidth * dpr);
  canvas.height = Math.round(innerHeight * dpr);
  gl.viewport(0, 0, canvas.width, canvas.height);
  const f = 1 / Math.tan(CFG.fov * Math.PI / 360), a = canvas.width / canvas.height, n = 0.1, far = 200;
  gl.uniformMatrix4fv(U.u_proj, false, [f / a, 0, 0, 0, 0, f, 0, 0, 0, 0, (far + n) / (n - far), -1, 0, 0, 2 * far * n / (n - far), 0]);
}
addEventListener("resize", resize);
resize();

// Rotate a unit vector toward another by an eased amount (handles opposites).
function turnToward(a, b, k) {
  let v = add(a, add(b, a, -1), k);
  if (Math.hypot(v[0], v[1], v[2]) < 1e-3) v = add(a, cross(a, [0.3, 0.2, 0.9]), k);
  return norm(v);
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  const t = now / 1000;

  // A slow drift when the cursor has been still for a while.
  const idle = (now - lastMove) / 1000;
  const sway = Math.min(1, Math.max(0, (idle - 8) / 6));
  const ty = targetYaw + sway * 0.18 * Math.sin(t * 0.13);
  const tp = targetPitch + sway * 0.08 * Math.sin(t * 0.09 + 1);
  const le = 1 - Math.exp(-dt * CFG.lookEase);
  yaw += (ty - yaw) * le;
  pitch += (tp - pitch) * le;
  dir = turnToward(dir, targetDir, 1 - Math.exp(-dt * CFG.turnEase));

  // Move heads along the flow and wrap them inside the cube around the camera.
  const step = CFG.speed * speedMul * dt;
  for (let i = 0; i < S; i++) {
    const o = i * 4, s = speeds[i] * step;
    for (let k = 0; k < 3; k++) {
      let v = heads[o + k] + dir[k] * s;
      if (v > half) v -= CFG.box; else if (v < -half) v += CFG.box;
      heads[o + k] = v;
    }
  }
  gl.activeTexture(gl.TEXTURE1);
  gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, TEX_W, TEX_H, gl.RGBA, gl.FLOAT, heads);
  gl.activeTexture(gl.TEXTURE0);

  // View matrix from yaw/pitch (camera at the origin).
  const { fwd, right, up } = basis(yaw, pitch);
  gl.uniformMatrix4fv(U.u_view, false, [
    right[0], up[0], -fwd[0], 0,
    right[1], up[1], -fwd[1], 0,
    right[2], up[2], -fwd[2], 0,
    0, 0, 0, 1,
  ]);
  gl.uniform3fv(U.u_dir, dir);
  gl.uniform1f(U.u_time, t);
  gl.uniform3fv(U.u_clickRay, clickRay);
  gl.uniform1f(U.u_clickAge, (now - clickTime) / 1000);

  gl.clearColor(0, 0, 0, 1);
  gl.clear(gl.COLOR_BUFFER_BIT);
  gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, S * CFG.trail);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
